{% extends "base.html" %}

{% block title %}Edit Profile | Alli-Trade{% endblock %}

{% block content %}
<main class="mx-auto max-w-4xl px-6 py-10">
  <section class="rounded-3xl bg-white p-8 shadow-sm">
    <div class="mb-6">
      <h1 class="text-3xl font-bold tracking-tight text-slate-900">Edit Profile</h1>
      <p class="mt-2 text-sm text-slate-600">Update your student details and profile information.</p>
    </div>

    <form method="POST" action="{% url 'edit_profile' %}" class="space-y-6">
      {% csrf_token %}

      <div class="grid gap-6 md:grid-cols-2">
        <div>
          <label class="mb-2 block text-xs font-semibold uppercase text-slate-500">First name</label>
          <input name="first_name" type="text" value="{{ user.first_name|default:'' }}" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-200" />
        </div>
        <div>
          <label class="mb-2 block text-xs font-semibold uppercase text-slate-500">Last name</label>
          <input name="last_name" type="text" value="{{ user.last_name|default:'' }}" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-200" />
        </div>
      </div>

      <div>
        <label class="mb-2 block text-xs font-semibold uppercase text-slate-500">Avatar URL</label>
        <input name="avatar_url" type="url" value="{{ profile.avatar_url|default:'' }}" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-200" />
      </div>

      <div class="grid gap-6 md:grid-cols-2">
        <div>
          <label class="mb-2 block text-xs font-semibold uppercase text-slate-500">Year</label>
          <input name="year" type="text" value="{{ profile.year|default:'' }}" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-200" />
        </div>
        <div>
          <label class="mb-2 block text-xs font-semibold uppercase text-slate-500">Major</label>
          <input name="major" type="text" value="{{ profile.major|default:'' }}" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-200" />
        </div>
      </div>

      <div>
        <label class="mb-2 block text-xs font-semibold uppercase text-slate-500">Bio</label>
        <textarea name="bio" rows="5" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-200">{{ profile.bio|default:'' }}</textarea>
      </div>

      <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <a href="{% url 'account' %}" class="inline-flex items-center justify-center rounded-xl border border-slate-200 bg-white px-5 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-50">Cancel</a>
        <button type="submit" class="inline-flex items-center justify-center rounded-xl bg-slate-900 px-6 py-3 text-sm font-semibold text-white hover:bg-slate-700">Save changes</button>
      </div>
    </form>
  </section>
</main>
{% endblock %}
