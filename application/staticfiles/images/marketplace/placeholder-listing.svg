<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Marketplace placeholder listing</title>
  <desc id="desc">A stylized marketplace card illustration with a gradient background, price tag, and product/service blocks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="1020" cy="120" r="170" fill="#38bdf822"/>
  <circle cx="180" cy="690" r="220" fill="#f59e0b1f"/>
  <rect x="120" y="110" width="960" height="580" rx="42" fill="#ffffff12" stroke="#ffffff24"/>

  <g transform="translate(210 170)">
    <rect x="0" y="0" width="780" height="460" rx="32" fill="url(#card)"/>
    <rect x="42" y="42" width="280" height="210" rx="24" fill="#cbd5e1"/>
    <rect x="58" y="58" width="248" height="178" rx="18" fill="url(#accent)" opacity="0.92"/>
    <circle cx="142" cy="126" r="38" fill="#f8fafc" opacity="0.95"/>
    <path d="M74 194c32-56 86-86 150-86s118 30 150 86v22H74z" fill="#f8fafc" opacity="0.92"/>

    <rect x="360" y="52" width="338" height="24" rx="12" fill="#cbd5e1"/>
    <rect x="360" y="96" width="250" height="18" rx="9" fill="#e2e8f0"/>
    <rect x="360" y="134" width="300" height="18" rx="9" fill="#e2e8f0"/>
    <rect x="360" y="178" width="184" height="72" rx="18" fill="#0f172a"/>
    <text x="392" y="226" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">$24</text>

    <rect x="42" y="292" width="696" height="104" rx="24" fill="#f8fafc"/>
    <rect x="62" y="316" width="200" height="16" rx="8" fill="#94a3b8"/>
    <rect x="62" y="348" width="560" height="16" rx="8" fill="#cbd5e1"/>
    <rect x="62" y="380" width="390" height="16" rx="8" fill="#cbd5e1"/>

    <g transform="translate(360 308)">
      <rect x="0" y="0" width="156" height="70" rx="20" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="24" y="44" fill="#1d4ed8" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">For Sale</text>
    </g>
    <g transform="translate(536 308)">
      <rect x="0" y="0" width="160" height="70" rx="20" fill="#ecfdf5" stroke="#86efac"/>
      <text x="30" y="44" fill="#15803d" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Campus</text>
    </g>
  </g>

  <rect x="260" y="690" width="680" height="22" rx="11" fill="#ffffff24"/>
</svg>
