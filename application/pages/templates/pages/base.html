<!-- 
pages/templates/pages/base.html
This is the base template for the "pages" app. It defines the overall HTML structure and includes blocks for the title and content that can be overridden by child templates.
Created by Subreet Singh on 02-23-2026
-->

{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{% block title %}{% if page_title %}{{page_title}} | {% endif %}Alli-trade{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="min-h-screen bg-gradient-to-b from-slate-50 to-white text-slate-900">

    <header class="sticky top-0 z-20 border-b bg-white/80 backdrop-blur">
      <div class="mx-auto max-w-6xl px-4">
        <div class="flex h-16 items-center justify-between">

          <!-- Logo -->
          <a href="/" class="flex items-center gap-3">
            <div class="grid h-9 w-9 place-items-center rounded-xl bg-slate-900 text-white text-sm font-semibold">
              T17
            </div>
            <div class="leading-tight">
              <div class="font-semibold tracking-tight">Team 17</div>
              <div class="text-xs text-slate-500">CSC 648 Web App</div>
            </div>
          </a>

          <!-- Navigation -->
          <nav class="flex items-center gap-2 text-sm">

            <a href="{% url 'about' %}" class="rounded-lg px-3 py-2 text-slate-600 hover:bg-slate-100 hover:text-slate-900">
              Team
            </a>

            <a href="{% url 'marketplace_home' %}" class="rounded-lg px-3 py-2 text-slate-600 hover:bg-slate-100 hover:text-slate-900">
              Marketplace
            </a>

            <!-- AUTH FIXED NAV -->
            {% if user and user.id %}
              
              <a href="{% url 'account' %}" class="rounded-lg px-3 py-2 text-slate-600 hover:bg-slate-100 hover:text-slate-900">
                Account
              </a>

              <a href="{% url 'logout' %}" class="rounded-lg px-3 py-2 text-slate-600 hover:bg-slate-100 hover:text-slate-900">
                Logout
              </a>

            {% else %}

              <a href="{% url 'login' %}" class="rounded-lg px-3 py-2 text-slate-600 hover:bg-slate-100 hover:text-slate-900">
                Login
              </a>

              <a href="{% url 'register' %}" class="rounded-lg px-3 py-2 text-slate-600 hover:bg-slate-100 hover:text-slate-900">
                Sign Up
              </a>

            {% endif %}

          </nav>

        </div>
      </div>
    </header>

    <main class="mx-auto max-w-6xl px-4 py-10">
      {% block content %}{% endblock %}
    </main>

    {% block footer %}{% endblock %}

  </body>
</html>
