name: Auto Assign PR Leads

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: write
  contents: read

jobs:
  auto_assign:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-assign frontend/backend leads
        uses: hmarr/auto-assign-action@v2.1.0
        with:
          configuration-path: .github/auto_assign.yml
